name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Validate structure, notebook syntax, links, and imported artifacts
        run: python scripts/validate_repository.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.4 rasterio==1.5.0 Flask==3.1.3 pytest==9.1.1
      - name: Test input handling, centroids, and local API
        run: python -m pytest -q

  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MPLCONFIGDIR: /tmp/terramind-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deployment/requirements.txt
      - name: Install complete CPU deployment environment
        run: python -m pip install -r deployment/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run real model through the cloud entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import rasterio
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file('deployment/streamlit_app.py').run(timeout=120)
          assert not app.exception, list(app.exception)
          app.button[0].click().run(timeout=120)
          assert not app.exception, list(app.exception)
          packet = app.session_state['packet']
          assert packet['schema_version'] == '1.1'
          assert packet['detection']['plume_pixel_count'] == 1244
          assert packet['detection']['centroid_wgs84'] is not None
          with rasterio.open(packet['artifacts']['mask_path']) as mask:
              assert mask.shape == (512, 512)
              assert mask.count == 1
          print('Cloud entrypoint: real CPU inference passed without model downloads')
          PY
