name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Validate structure, notebook syntax, links, and imported artifacts
        run: python scripts/validate_repository.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.4 rasterio==1.5.0 Flask==3.1.3 pytest==9.1.1
      - name: Test input handling, centroids, and local API
        run: python -m pytest -q
